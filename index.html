/* ============================================================
   CHOIX D'UNE COULEUR
   Le champ « color » du navigateur donne un nuancier convenable sur
   ordinateur et ce que le téléphone veut bien afficher sur mobile. On dessine
   donc la roue soi-même : la teinte tourne autour du centre, la saturation
   s'éloigne du bord, la luminosité se règle en dessous. Le même geste
   « pointer » vaut pour le doigt et pour la souris.
   ============================================================ */
const hex2 = n => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2,"0");
function hsv2rgb(h, s, v){
  h = ((h % 360) + 360) % 360;
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r, g, b;
  if(h < 60)       { r=c; g=x; b=0; }
  else if(h < 120) { r=x; g=c; b=0; }
  else if(h < 180) { r=0; g=c; b=x; }
  else if(h < 240) { r=0; g=x; b=c; }
  else if(h < 300) { r=x; g=0; b=c; }
  else             { r=c; g=0; b=x; }
  return [(r+m)*255, (g+m)*255, (b+m)*255];
}
const hsv2hex = (h,s,v) => "#" + hsv2rgb(h,s,v).map(hex2).join("");
function hex2hsv(hex){
  const n = parseInt((hex || "").replace("#",""), 16);
  const r = ((n>>16)&255)/255, g = ((n>>8)&255)/255, b = (n&255)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
  let h = 0;
  if(d){
    if(mx === r)      h = 60 * (((g - b) / d) % 6);
    else if(mx === g) h = 60 * ((b - r) / d + 2);
    else              h = 60 * ((r - g) / d + 4);
  }
  return { h:((h%360)+360)%360, s:mx ? d/mx : 0, v:mx };
}
const normHex = t => {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(t||"").trim());
  return m ? "#" + m[1].toLowerCase() : null;
};
const teinte = { h:0, s:0, v:0 };

function dessinerRoue(cv){
  const n = cv.width, R = n / 2, ctx = cv.getContext("2d");
  const img = ctx.createImageData(n, n), d = img.data;
  for(let y = 0; y < n; y++){
    for(let x = 0; x < n; x++){
      const dx = x - R + .5, dy = y - R + .5;
      const r = Math.sqrt(dx*dx + dy*dy), i = (y*n + x) * 4;
      if(r > R){ d[i+3] = 0; continue; }
      let a = Math.atan2(dy, dx) * 180 / Math.PI + 90;
      const c = hsv2rgb(a, Math.min(1, r / R), teinte.v);
      d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2];
      // Un bord franc sur un disque tramé fait des marches d'escalier :
      // le dernier pixel est adouci.
      d[i+3] = r > R - 1 ? Math.round((R - r) * 255) : 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}
function placerCurseurs(){
  const cur = document.getElementById("roue-cur");
  const lcur = document.getElementById("lum-cur");
  const lum = document.getElementById("lum");
  const ap = document.getElementById("apercu-p");
  const hx = document.getElementById("m-hex");
  const hex = hsv2hex(teinte.h, teinte.s, teinte.v);
  if(cur){
    const a = (teinte.h - 90) * Math.PI / 180;
    cur.style.left = (50 + Math.cos(a) * teinte.s * 50) + "%";
    cur.style.top  = (50 + Math.sin(a) * teinte.s * 50) + "%";
    cur.style.background = hex;
  }
  if(lcur) lcur.style.left = (teinte.v * 100) + "%";
  if(lum) lum.style.background = "linear-gradient(90deg,#000000," + hsv2hex(teinte.h, teinte.s, 1) + ")";
  if(ap) ap.style.background = hex;
  if(hx && document.activeElement !== hx) hx.value = hex.toUpperCase();
  appliquerAccent(hex);
}
/* Un pointeur capturé continue d'alimenter la zone qu'il a saisie même quand
   le doigt en sort : on peut donc glisser jusqu'au bord sans perdre la main. */
function suivre(zone, calcul){
  if(!zone) return;
  let actif = false;
  const lire = ev => {
    const r = zone.getBoundingClientRect();
    calcul((ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height);
    placerCurseurs();
  };
  zone.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    actif = true;
    try{ zone.setPointerCapture(ev.pointerId); }catch(e){}
    lire(ev);
  });
  zone.addEventListener("pointermove", ev => { if(actif) lire(ev); });
  const fin = () => { actif = false; };
  zone.addEventListener("pointerup", fin);
  zone.addEventListener("pointercancel", fin);
}
function monterRoue(){
  const cv = document.getElementById("roue-c");
  if(!cv) return;
  dessinerRoue(cv);
  placerCurseurs();
  suivre(document.getElementById("roue"), (x, y) => {
    const dx = x - .5, dy = y - .5;
    const r = Math.sqrt(dx*dx + dy*dy) * 2;
    teinte.s = Math.max(0, Math.min(1, r));
    teinte.h = Math.atan2(dy, dx) * 180 / Math.PI + 90;
  });
  suivre(document.getElementById("lum"), x => {
    const av = teinte.v;
    teinte.v = Math.max(0.04, Math.min(1, x));
    // La roue ne dépend que de la luminosité : inutile de la refaire autrement.
    if(Math.abs(teinte.v - av) > 0.001) dessinerRoue(cv);
  });
}

/* ---------- rangement au doigt ou à la souris ----------
   Un événement « pointer » couvre les deux : le doigt sur le téléphone, la
   souris sur l'ordinateur, sans code séparé. La ligne saisie suit le geste,
   et quand son milieu dépasse celui d'une voisine, les deux échangent leur
   place tout de suite : on voit le résultat avant de lâcher. Le repère
   vertical est recalé à chaque échange pour que la ligne reste sous le doigt.
   touch-action:none, posé sur ces lignes seulement, empêche le même geste de
   faire aussi défiler la page. */
let glisse = null;
document.addEventListener("pointerdown", ev => {
  if(!state.reorg || glisse) return;
  const row = ev.target.closest(".prow.drg");
  if(!row) return;
  const liste = row.closest(".plist[data-reorg]");
  if(!liste) return;
  ev.preventDefault();
  try{ row.setPointerCapture(ev.pointerId); }catch(e){}
  glisse = { row, liste, y:ev.clientY, pid:ev.pointerId };
  row.classList.add("drag");
});
document.addEventListener("pointermove", ev => {
  if(!glisse || ev.pointerId !== glisse.pid) return;
  const row = glisse.row, liste = glisse.liste;
  row.style.transform = "translateY(" + (ev.clientY - glisse.y) + "px)";
  const r = row.getBoundingClientRect(), milieu = r.top + r.height / 2;
  for(const f of Array.prototype.slice.call(liste.children)){
    if(f === row || !f.dataset || !f.dataset.id) continue;
    const fr = f.getBoundingClientRect(), fm = fr.top + fr.height / 2;
    const apres = !!(f.compareDocumentPosition(row) & Node.DOCUMENT_POSITION_FOLLOWING);
    if(apres && milieu < fm) liste.insertBefore(row, f);
    else if(!apres && milieu > fm) liste.insertBefore(row, f.nextSibling);
    else continue;
    glisse.y = ev.clientY;
    row.style.transform = "";
    break;
  }
});
function finGlisse(){
  if(!glisse) return;
  const row = glisse.row, liste = glisse.liste;
  glisse = null;
  row.classList.remove("drag");
  row.style.transform = "";
  Array.prototype.slice.call(liste.children).map(x => x.dataset && x.dataset.id)
    .filter(Boolean)
    .forEach((id, k) => {
      const p = DB.projets[id];
      if(p && p.ordre !== k){ p.ordre = k; sauverProjet(p); }
    });
  DB.settings.triProjets = "manuel";
  sauver();
  render();
}
document.addEventListener("pointerup", finGlisse);
document.addEventListener("pointercancel", finGlisse);

/* ============================================================
   SAUVEGARDE VERS GOOGLE DRIVE
   Flux OAuth « jeton » de Google Identity Services : pas de secret côté
   client, pas de jeton de rafraîchissement. L'autorisation dure environ une
   heure puis se renouvelle sans rien demander tant que la session Google est
   active. Portée drive.file : CashFlow ne voit que les fichiers qu'il a créés.
   ============================================================ */
const GD = { jeton:null, expire:0, client:null, attente:[], enCours:false, chargement:null };
const gdClient = () => ((DB.settings && DB.settings.gid) || CFG.gid || "").trim();
const gdConnecte = () => !!(gdClient() && DB.settings.gdFichier);
const GD_FICHIER = "cashflow-sauvegarde.json";
const gdNomDossier = () => (DB.settings.gdNom || "CashFlow").replace(/['\\]/g, "");

function chargerGIS(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if(GD.chargement) return GD.chargement;
  GD.chargement = new Promise((res,rej) => {
    const b = document.createElement("script");
    b.src = "https://accounts.google.com/gsi/client";
    b.async = true; b.defer = true;
    b.onload = () => res();
    b.onerror = () => rej(new Error("bibliothèque Google injoignable"));
    document.head.appendChild(b);
  });
  return GD.chargement;
}
async function gdJeton(interactif){
  if(GD.jeton && Date.now() < GD.expire - 60000) return GD.jeton;
  if(!gdClient()) throw new Error("identifiant client absent");
  await chargerGIS();
  return new Promise((res,rej) => {
    if(!GD.client){
      GD.client = google.accounts.oauth2.initTokenClient({
        client_id: gdClient(),
        scope: "https://www.googleapis.com/auth/drive.file",
        callback: r => {
          if(r && r.access_token){
            GD.jeton = r.access_token;
            GD.expire = Date.now() + ((r.expires_in || 3600) * 1000);
            GD.attente.forEach(f => f.res(GD.jeton));
          }else GD.attente.forEach(f => f.rej(new Error("autorisation refusée")));
          GD.attente = [];
        },
        error_callback: e => {
          GD.attente.forEach(f => f.rej(new Error((e && (e.type || e.message)) || "autorisation impossible")));
          GD.attente = [];
        }
      });
    }
    GD.attente.push({ res, rej });
    const dem = { prompt: interactif ? "consent" : "" };
    if(DB.settings.gdMail) dem.hint = DB.settings.gdMail;
    try{ GD.client.requestAccessToken(dem); }
    catch(e){ GD.attente = []; rej(e); }
  });
}
async function gdAppel(url, opts, interactif){
  const t = await gdJeton(!!interactif);
  const o = opts || {};
  const r = await fetch(url, { ...o, headers:{ Authorization:"Bearer " + t, ...(o.headers || {}) } });
  if(r.status === 401){ GD.jeton = null; throw new Error("session expirée"); }
  if(!r.ok) throw new Error("Drive " + r.status + " " + (await r.text()).slice(0,120));
  return r;
}
async function gdDossier(interactif){
  if(DB.settings.gdDossier) return DB.settings.gdDossier;
  const q = "mimeType='application/vnd.google-apps.folder' and name='" + gdNomDossier() + "' and trashed=false";
  const r = await gdAppel("https://www.googleapis.com/drive/v3/files?fields=files(id)&q=" + encodeURIComponent(q), null, interactif);
  const d = await r.json();
  let id = d.files && d.files[0] && d.files[0].id;
  if(!id){
    const c = await gdAppel("https://www.googleapis.com/drive/v3/files?fields=id", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ name:gdNomDossier(), mimeType:"application/vnd.google-apps.folder" })
    });
    id = (await c.json()).id;
  }
  DB.settings.gdDossier = id; sauver(true);
  return id;
}
function contenuSauvegarde(){
  return JSON.stringify({ app:"cashflow", appVersion:VERSION, schema:SCHEMA,
    exportedAt:new Date().toISOString(), projets:DB.projets, ops:DB.ops, plans:DB.plans,
    settings:DB.settings, meta:DB.meta });
}
async function gdRetenirCompte(){
  if(DB.settings.gdMail) return;
  try{
    const r = await gdAppel("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)");
    const m = (await r.json()).user.emailAddress;
    if(m){ DB.settings.gdMail = m; sauver(true); }
  }catch(e){}
}
async function gdEnvoyer(interactif){
  if(GD.enCours) return null;
  GD.enCours = true;
  try{
    const contenu = contenuSauvegarde();
    if(DB.settings.gdFichier){
      try{
        await gdAppel("https://www.googleapis.com/upload/drive/v3/files/" + DB.settings.gdFichier + "?uploadType=media",
          { method:"PATCH", headers:{ "Content-Type":"application/json" }, body:contenu }, interactif);
        DB.meta.cloud = Date.now(); DB.meta.exporte = Date.now(); DB.meta.cloudErr = null; sauver(true);
        return contenu.length;
      }catch(e){
        if(!/Drive 404/.test(e.message)) throw e;
        DB.settings.gdFichier = "";
      }
    }
    const dossier = await gdDossier(interactif);
    const lim = "cashflow" + Date.now();
    const corps = "--" + lim + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" +
      JSON.stringify({ name:GD_FICHIER, parents:[dossier] }) + "\r\n" +
      "--" + lim + "\r\nContent-Type: application/json\r\n\r\n" + contenu + "\r\n--" + lim + "--";
    const r = await gdAppel("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
      { method:"POST", headers:{ "Content-Type":"multipart/related; boundary=" + lim }, body:corps }, interactif);
    DB.settings.gdFichier = (await r.json()).id;
    DB.meta.cloud = Date.now(); DB.meta.exporte = Date.now(); DB.meta.cloudErr = null; sauver(true);
    return contenu.length;
  }finally{ GD.enCours = false; }
}
async function gdRecuperer(interactif){
  if(!DB.settings.gdFichier){
    const q = "name='" + GD_FICHIER + "' and trashed=false";
    const r = await gdAppel("https://www.googleapis.com/drive/v3/files?fields=files(id,modifiedTime)&orderBy=modifiedTime desc&q=" +
      encodeURIComponent(q), null, interactif);
    const d = await r.json();
    if(!d.files || !d.files.length) throw new Error("aucune sauvegarde trouvée sur ce compte");
    DB.settings.gdFichier = d.files[0].id; sauver(true);
  }
  const r = await gdAppel("https://www.googleapis.com/drive/v3/files/" + DB.settings.gdFichier + "?alt=media", null, interactif);
  return r.json();
}
function gdDeconnecter(){
  try{ if(GD.jeton && window.google && google.accounts) google.accounts.oauth2.revoke(GD.jeton); }catch(e){}
  GD.jeton = null; GD.expire = 0; GD.client = null;
  DB.settings.gdFichier = ""; DB.settings.gdDossier = ""; DB.settings.gdMail = "";
  DB.meta.cloud = 0; sauver(true);
}
/* Dépôt discret : deux minutes après le dernier changement, si quelque chose a
   réellement bougé, et au plus une fois par demi-heure. Quand ce délai n'est
   pas écoulé, le dépôt est reprogrammé pour le moment où il le sera. */
const CLOUD_MINI = 30 * 60000;
function gdReste(){ return CLOUD_MINI - (Date.now() - (DB.meta.cloud || 0)); }
function gdPourquoiPas(){
  if(!gdConnecte()) return "aucun compte relié";
  if(!DB.settings.gdAuto) return "dépôt automatique désactivé";
  if((DB.meta.modifie || 0) <= (DB.meta.cloud || 0)) return "à jour, rien de neuf depuis le dernier dépôt";
  const r = gdReste();
  if(r > 0) return "modifications en attente, dépôt dans " + Math.ceil(r/60000) + " min";
  if(_cloudQuand > Date.now()) return "dépôt programmé dans " + Math.max(1, Math.round((_cloudQuand - Date.now())/60000)) + " min";
  return null;
}
function gdEtat(){
  const e = DB.meta.cloudErr;
  if(e && (DB.meta.modifie || 0) > (DB.meta.cloud || 0))
    return { txt:"dernier dépôt automatique en échec : " + e.m, ko:true };
  return { txt:gdPourquoiPas() || "dépôt imminent", ko:false };
}
async function gdAuto(){
  _cloudQuand = 0;
  if(!gdConnecte() || !DB.settings.gdAuto) return;
  if((DB.meta.modifie || 0) <= (DB.meta.cloud || 0)) return;
  const r = gdReste();
  if(r > 0){
    clearTimeout(_cloud);
    _cloudQuand = Date.now() + r + 2000;
    _cloud = setTimeout(gdAuto, r + 2000);
    return;
  }
  try{ await gdEnvoyer(false); }
  catch(e){
    DB.meta.cloudErr = { q:Date.now(), m:String((e && e.message) || e).slice(0,140) };
    sauver(true);
  }
  if(state.tab === "reglages") render();
}
async function gdRelier(){
  try{
    await gdJeton(true);
    await gdRetenirCompte();
    await gdEnvoyer(true);
    toast("Compte relié"); render();
  }catch(e){ toast(String((e && e.message) || e)); }
}
async function gdEnvoyerUI(){
  try{ await gdEnvoyer(true); toast("Sauvegarde déposée"); render(); }
  catch(e){ toast(String((e && e.message) || e)); }
}
async function gdRestaurerUI(){
  try{
    const d = await gdRecuperer(true);
    const r = fusionnerSauvegarde(d);
    toast(r.np + " projets et " + r.no + " opérations ajoutés");
    materialiser(); render();
  }catch(e){ toast(String((e && e.message) || e)); }
}

/* ============================================================
   EXPORT EXCEL (.xlsx)
   Un .xlsx est une archive ZIP de fichiers XML. Plutôt que d'embarquer une
   bibliothèque, on écrit l'archive à la main : entrées stockées sans
   compression, ce qu'Excel, LibreOffice et Numbers acceptent sans réserve.
   ============================================================ */
const CRCT = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++) c = CRCT[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipper(fichiers){
  const enc = new TextEncoder();
  const morceaux = [], central = [];
  let off = 0;
  fichiers.forEach(f => {
    const nom = enc.encode(f.nom), data = enc.encode(f.txt);
    const crc = crc32(data), sz = data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, 0, true); lh.setUint16(12, 0, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true);
    lh.setUint16(26, nom.length, true); lh.setUint16(28, 0, true);
    morceaux.push(new Uint8Array(lh.buffer), nom, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, 0, true);
    ch.setUint16(14, 0, true); ch.setUint32(16, crc, true); ch.setUint32(20, sz, true);
    ch.setUint32(24, sz, true); ch.setUint16(28, nom.length, true); ch.setUint16(30, 0, true);
    ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), nom);
    off += 30 + nom.length + sz;
  });
  const tailleC = central.reduce((s,x) => s + x.length, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true); eo.setUint16(4, 0, true); eo.setUint16(6, 0, true);
  eo.setUint16(8, fichiers.length, true); eo.setUint16(10, fichiers.length, true);
  eo.setUint32(12, tailleC, true); eo.setUint32(16, off, true); eo.setUint16(20, 0, true);
  return new Blob([...morceaux, ...central, new Uint8Array(eo.buffer)], {
    type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
const xesc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;" }[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, "");
const COL = ["A","B","C","D","E"];
function serieDate(iso){
  const t = Date.parse(iso + "T00:00:00Z");
  if(isNaN(t)) return null;
  return Math.round((t - Date.parse("1899-12-30T00:00:00Z")) / 86400000);
}
function feuilleXML(lignes){
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<cols><col min="1" max="1" width="12"/><col min="2" max="2" width="12"/>' +
    '<col min="3" max="3" width="34"/><col min="4" max="4" width="14"/>' +
    '<col min="5" max="5" width="22"/></cols><sheetData>';
  lignes.forEach((l, i) => {
    const r = i + 1;
    x += '<row r="' + r + '">' + l.map((c, j) => {
      const ref = COL[j] + r;
      if(c && c.n !== undefined) return '<c r="' + ref + '" s="' + (c.s || 0) + '"><v>' + c.n + '</v></c>';
      const s = c && c.s ? c.s : (i === 0 ? 3 : 0);
      return '<c r="' + ref + '" t="inlineStr" s="' + s + '"><is><t xml:space="preserve">' +
        xesc(c && c.t !== undefined ? c.t : c) + '</t></is></c>';
    }).join("") + '</row>';
  });
  return x + '</sheetData></worksheet>';
}
function nomFeuille(t, pris){
  let n = String(t || "Feuille").replace(/[\[\]:*?\/\\]/g, " ").replace(/\s+/g, " ").trim().slice(0,28) || "Feuille";
  let b = n, i = 2;
  while(pris.has(n.toLowerCase())){ n = b.slice(0,25) + " " + i; i++; }
  pris.add(n.toLowerCase());
  return n;
}
function exporterXLSX(){
  const l = trierOps(opsAll(), "ancien");
  if(!l.length) return toast("Aucune opération");
  const entete = ["Date","Type","Libellé","Montant","Projet"];
  const TYPE = { ajout:"Ajout", depense:"Dépense", transfert:"Transfert" };

  function ligne(o, pid){
    const mt = pid ? effet(o, pid) : (o.type === "depense" ? -o.montant : o.type === "ajout" ? o.montant : o.montant);
    const nom = o.type === "transfert" ? nomProjet(o.de) + " → " + nomProjet(o.vers) : nomProjet(o.projet);
    const ser = serieDate(o.date);
    return [ ser === null ? { t:o.date } : { n:ser, s:1 },
             { t:TYPE[o.type] || o.type },
             { t:libelleOp(o, pid) },
             { n:(mt/100).toFixed(2), s:2 },
             { t:pid ? nomProjet(pid) : nom } ];
  }
  const feuilles = [];
  // Sur la feuille globale un transfert n'apparaît qu'une fois : additionner
  // la colonne compterait donc un mouvement neutre. Les deux totaux justes
  // sont écrits en pied de feuille.
  const global = [entete].concat(l.map(o => ligne(o, null)));

  global.push(["", "", "", "", ""]);

  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +

    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
    '<fills count="2"><fill><patternFill patternType="none"/></fill>' +
    '<fill><patternFill patternType="gray125"/></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="4">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
    '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

  const wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
    feuilles.map((f,i) => '<sheet name="' + xesc(f.nom) + '" sheetId="' + (i+1) + '" r:id="rId' + (i+1) + '"/>').join("") +
    '</sheets></workbook>';
  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    feuilles.map((f,i) => '<Relationship Id="rId' + (i+1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i+1) + '.xml"/>').join("") +
    '<Relationship Id="rId' + (feuilles.length+1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '</Relationships>';
  const ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +

    feuilles.map((f,i) => '<Override PartName="/xl/worksheets/sheet' + (i+1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("") +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    '</Types>';
  const racine = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>';

  const fichiers = [
    { nom:"[Content_Types].xml", txt:ct },
    { nom:"_rels/.rels", txt:racine },
    { nom:"xl/workbook.xml", txt:wb },
    { nom:"xl/_rels/workbook.xml.rels", txt:rels },
    { nom:"xl/styles.xml", txt:styles }
  ].concat(feuilles.map((f,i) => ({ nom:"xl/worksheets/sheet" + (i+1) + ".xml", txt:feuilleXML(f.lignes) })));

  const d = new Date();
  telecharger("cashflow-" + d.getFullYear() + p2(d.getMonth()+1) + p2(d.getDate()) + ".xlsx", zipper(fichiers));
  toast("Fichier Excel créé");
}

/* ============================================================
   ICÔNE ET MANIFESTE
   Dessinés à la volée pour reprendre la couleur d'accent choisie : l'icône
   posée sur l'écran d'accueil ressemble à l'application ouverte. Le
   manifeste est construit ici même, sans fichier séparé à déposer.
   ============================================================ */
function dessinerIcone(taille, marge){
  const c = document.createElement("canvas");
  c.width = c.height = taille;
  const x = c.getContext("2d");
  const acc = accentActuel();
  const p = marge ? taille * 0.12 : 0;          // marge pour l'icône « maskable »
  const t = taille - p * 2, r = t * 0.22;
  x.fillStyle = marge ? acc : acc;
  if(marge){ x.fillStyle = acc; x.fillRect(0, 0, taille, taille); }
  else{
    x.beginPath();
    x.moveTo(r, 0); x.arcTo(t, 0, t, t, r); x.arcTo(t, t, 0, t, r);
    x.arcTo(0, t, 0, 0, r); x.arcTo(0, 0, t, 0, r); x.closePath();
    x.fillStyle = acc; x.fill();
  }
  const u = taille / 64, o = p;
  x.strokeStyle = surAccent(acc) === "#000000" ? "#000000" : "#ffffff";
  x.lineCap = "round"; x.lineWidth = 5.5 * (t/64);
  x.beginPath();
  x.arc(o + 32*(t/64), o + 32*(t/64), 14*(t/64), -Math.PI*0.28, Math.PI*0.28, true);
  x.stroke();
  x.beginPath();
  x.moveTo(o + 18*(t/64), o + 28*(t/64)); x.lineTo(o + 38*(t/64), o + 28*(t/64));
  x.moveTo(o + 18*(t/64), o + 36*(t/64)); x.lineTo(o + 38*(t/64), o + 36*(t/64));
  x.stroke();
  return c.toDataURL("image/png");
}
let _manifeste = null;
function majIcone(){
  try{
    const acc = accentActuel();
    const fav = document.getElementById("favicon");
    if(fav) fav.href = "data:image/svg+xml," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
      '<rect width="64" height="64" rx="14" fill="' + acc + '"/>' +
      '<path d="M42 20a14 14 0 1 0 0 24" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>' +
      '<path d="M18 28h20M18 36h20" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/></svg>');

    const p192 = dessinerIcone(192, false), p512 = dessinerIcone(512, false), pm = dessinerIcone(512, true);
    let at = document.querySelector('link[rel="apple-touch-icon"]');
    if(!at){ at = document.createElement("link"); at.rel = "apple-touch-icon"; document.head.appendChild(at); }
    at.href = p192;

    const man = {
      name:"CashFlow", short_name:"CashFlow", start_url:".", scope:".",
      display:"standalone", orientation:"portrait",
      background_color: themeActuel() === "sombre" ? "#0d0d10" : "#ffffff",
      theme_color: themeActuel() === "sombre" ? "#0d0d10" : "#ffffff",
      icons:[ { src:p192, sizes:"192x192", type:"image/png" },
              { src:p512, sizes:"512x512", type:"image/png" },
              { src:pm,  sizes:"512x512", type:"image/png", purpose:"maskable" } ]
    };
    if(_manifeste) URL.revokeObjectURL(_manifeste);
    _manifeste = URL.createObjectURL(new Blob([JSON.stringify(man)], { type:"application/manifest+json" }));
    let lm = document.querySelector('link[rel="manifest"]');
    if(!lm){ lm = document.createElement("link"); lm.rel = "manifest"; document.head.appendChild(lm); }
    lm.href = _manifeste;
  }catch(e){ /* une icône ratée ne doit pas empêcher l'application de tourner */ }
}

/* ---------- espace disque ---------- */
async function majQuota(){
  if(!navigator.storage || !navigator.storage.estimate) return;
  try{
    state.quota = await navigator.storage.estimate();
    if(pret && state.tab === "reglages") render();
  }catch(e){}
}

/* ============================================================
   DÉMARRAGE
   ============================================================ */
async function demarrer(){
  try{
    await IDB.ouvrir();
    const k = await IDB.tout();
    DB = assembler(k);
  }catch(e){
    document.getElementById("view").innerHTML =
      '<div class="vide" style="margin-top:60px"><b>Stockage indisponible</b>' +
      esc(String((e && e.message) || e)) + '<br>La navigation privée de certains navigateurs interdit IndexedDB.</div>';
    return;
  }
  pret = true;

  // Le thème et l'accent sont lus depuis localStorage avant tout rendu ;
  // la sauvegarde restaurée peut en apporter d'autres, on les applique ici.
  if(!litLS(LSTHEME) && DB.settings.theme){ ecritLS(LSTHEME, DB.settings.theme); appliquerTheme(DB.settings.theme); }
  if(!litLS(LSACC) && DB.settings.accent){ ecritLS(LSACC, DB.settings.accent); appliquerAccent(DB.settings.accent); }
  DB.settings.theme = themeActuel();
  DB.settings.accent = accentActuel();

  // Le français est devenu la langue par défaut ; une installation antérieure
  // qui n'a jamais fait ce choix explicitement bascule, celle qui l'a fait
  // garde le sien.
  if(!DB.settings.langueChoisie && DB.settings.langue !== "fr"){ DB.settings.langue = "fr"; sauver(true); }

  // Le partage a été retiré : un projet reçu autrefois redevient un projet
  // ordinaire, modifiable, au lieu de rester figé en lecture seule.
  projets().forEach(x => { if(x.abonnement){ delete x.abonnement; sauverProjet(x); } });

  state.neuf = DB.meta.vue !== VERSION;
  const n = materialiser();
  render();
  majIcone();
  majQuota();
  if(n) toast(n + (n > 1 ? " échéances passées converties" : " échéance passée convertie"));
  if(gdConnecte() && DB.settings.gdAuto && (DB.meta.modifie || 0) > (DB.meta.cloud || 0)) gdAuto();
}

/* Un téléphone rouvert le lendemain doit rattraper ses échéances sans qu'on
   ait besoin de recharger la page. */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible" || !pret) return;
  if(DB.meta.materialise !== todayISO()){
    const n = materialiser();
    render();
    if(n) toast(n + (n > 1 ? " échéances passées converties" : " échéance passée convertie"));
  }
});
window.addEventListener("pagehide", () => { ecouler(); });

demarrer();
</script>
